name: Build FontToggle APK
on:
  push:
    paths:
      - 'fonttoggle/**'
      - '.github/workflows/fonttoggle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fonttoggle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleBasicDebug assembleTgDebug
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/basic/debug/app-basic-debug.apk fonttoggle.apk
          cp app/build/outputs/apk/tg/debug/app-tg-debug.apk fonttoggle-telegram.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fonttoggle-apk
          path: fonttoggle/*.apk
      - name: Publish to release (phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fonttoggle-latest
          name: 글자토글 APK (최신)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            fonttoggle/fonttoggle.apk
            fonttoggle/fonttoggle-telegram.apk
          body: |
            fonttoggle.apk: 기본판 (텔레그램 동기화 없음, Play 프로텍트에 안 막힘)
            fonttoggle-telegram.apk: 텔레그램 동기화 포함 (접근성 사용)
            빌드 커밋: ${{ github.sha }}
