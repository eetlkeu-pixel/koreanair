name: Build FontToggle APK
on:
  push:
    paths:
      - 'fonttoggle/**'
      - '.github/workflows/fonttoggle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fonttoggle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk fonttoggle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fonttoggle-apk
          path: fonttoggle/fonttoggle.apk
      - name: Publish to release (phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fonttoggle-latest
          name: 글자토글 APK (최신)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: fonttoggle/fonttoggle.apk
          body: |
            휴대폰에서 아래 fonttoggle.apk 를 눌러 내려받아 설치하세요.
            빌드 커밋: ${{ github.sha }}
